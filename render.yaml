services:
  - type: web
    name: muntu-coe-portal
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Opcionais — "Recuperar acesso" no login funciona sem eles (nunca
      # falha), só não envia e-mail de verdade sem as duas definidas.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
